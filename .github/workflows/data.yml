name: Refresh Fidelity Data

on:
  schedule:
    # Avoid the top-of-hour scheduling congestion documented by GitHub.
    - cron: "17 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: fidelity-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@main
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh rates and minimums
        shell: bash
        run: |
          set -o pipefail
          bun run scrape:fidelity -- --tab allClass --out data/fidelity-mm-allclass.json 2>&1 | tee "$RUNNER_TEMP/rates.log"
          bun run scrape:fidelity-minimums -- --out data/fidelity-mm-minimums.json 2>&1 | tee "$RUNNER_TEMP/minimums.log"

      - name: Validate generated data
        run: bun run validate:data

      - name: Commit updates
        run: |
          git add data/fidelity-mm-allclass.json data/fidelity-mm-minimums.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATETIME_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          git commit -m "✨ Refresh Fidelity data ($DATETIME_UTC)"
          git pull --rebase origin main
          git push

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: fidelity-data-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/*.log
            data/fidelity-mm-allclass.json
            data/fidelity-mm-minimums.json
          if-no-files-found: ignore
          retention-days: 14

  report-repeated-failure:
    needs: refresh
    if: always() && github.event_name == 'schedule' && needs.refresh.result == 'failure'
    uses: ./.github/workflows/repeated-failure.yml
    with:
      workflow_file: data.yml
      workflow_name: Refresh Fidelity Data
