name: Report repeated scheduled failure

on:
  workflow_call:
    inputs:
      workflow_file:
        required: true
        type: string
      workflow_name:
        required: true
        type: string

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@main
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: '${{ inputs.workflow_file }}',
              event: 'schedule',
              branch: context.payload.repository.default_branch,
              per_page: 10,
            });
            const previous = runs.data.workflow_runs.find(
              run => run.id !== context.runId && run.status === 'completed'
            );
            if (previous?.conclusion !== 'failure') {
              core.info('The previous scheduled run did not fail; no issue is needed.');
              return;
            }

            const title = `[automation] Repeated ${{ inputs.workflow_name }} failures`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const previousUrl = previous.html_url;
            const body = `Two consecutive scheduled runs failed:\n\n- ${previousUrl}\n- ${runUrl}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
