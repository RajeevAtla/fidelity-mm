name: Report refresh failure or recovery

on:
  workflow_call:
    inputs:
      workflow_file:
        required: true
        type: string
      workflow_name:
        required: true
        type: string
      result:
        required: true
        type: string
      failure_summary:
        default: ""
        type: string

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.sha }}

      - name: Report failure or recovery
        uses: actions/github-script@main
        env:
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          REFRESH_RESULT: ${{ inputs.result }}
          FAILURE_SUMMARY: ${{ inputs.failure_summary }}
        with:
          script: |
            const { reportRefresh } = require('./src/scripts/report-refresh.cjs');
            await reportRefresh({ github, context, core,
              workflowFile: process.env.WORKFLOW_FILE,
              workflowName: process.env.WORKFLOW_NAME,
              result: process.env.REFRESH_RESULT,
              summary: process.env.FAILURE_SUMMARY,
            });
